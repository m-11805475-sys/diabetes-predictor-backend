services:
  - type: web
    name: glucoguide-suggestions-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_PATH
        value: /var/data/suggestions.db
      - key: POSTS_PER_HOUR_PER_IP
        value: "20"
    disk:
      name: glucoguide-suggestions-data
      mountPath: /var/data
      sizeGB: 1
